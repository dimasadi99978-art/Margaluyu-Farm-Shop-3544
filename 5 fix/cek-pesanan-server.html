<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Server Pesanan - Margaluyu Farm</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#f5faf6;margin:0;padding:30px;color:#234}.box{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 5px 20px #0001}button{background:#06474a;color:#fff;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}.ok{color:#16813d}.bad{color:#b3261e}pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:8px}</style></head>
<body><div class="box"><h1>Cek Server Pesanan</h1><p>Halaman ini memeriksa apakah <code>/api/orders</code> di Vercel dapat dihubungi.</p><button id="btn">Tes Koneksi</button><div id="result" style="margin-top:18px"></div></div>
<script>document.getElementById('btn').onclick=async()=>{const el=document.getElementById('result');el.innerHTML='Memeriksa...';try{const r=await fetch('/api/orders',{cache:'no-store'});const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){j={raw:t}}if(r.ok){el.innerHTML='<h3 class="ok">✓ Server terhubung</h3><pre>'+JSON.stringify(j,null,2)+'</pre>'}else{el.innerHTML='<h3 class="bad">✗ Server merespons, tetapi konfigurasinya bermasalah</h3><pre>HTTP '+r.status+'\n'+JSON.stringify(j,null,2)+'</pre>'}}catch(e){el.innerHTML='<h3 class="bad">✗ Gagal terhubung</h3><pre>'+e.message+'</pre>'}};</script></body></html>
