<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Pesanan - Margaluyu Farm</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f0f9f2;
            color: #2c3e2f;
            margin: 0;
            padding: 30px 16px 80px;
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #0a3d38;
            font-size: 1.6em;
        }

        .login-box {
            max-width: 360px;
            margin: 80px auto;
            background: #fff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfe3d3;
            border-radius: 8px;
            margin: 14px 0;
            box-sizing: border-box;
        }

        .login-box button,
        .refresh-btn {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box button:hover,
        .refresh-btn:hover {
            background: #0a3d38;
        }

        .login-error {
            color: #b3261e;
            font-size: 0.9em;
            display: none;
        }

        #adminPanel {
            display: none;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .order-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .order-card .top-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .order-id {
            font-weight: 800;
            color: #0a3d38;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
            color: #fff;
        }

        .status-Dikonfirmasi {
            background: #999;
        }

        .status-Dikemas {
            background: #d98c2b;
        }

        .status-Dikirim {
            background: #2f80c9;
        }

        .status-Selesai {
            background: #27ae60;
        }

        .order-detail {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .contact-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .contact-row a { padding: 8px 14px; border-radius: 10px; font-size: 0.88em; font-weight: 600; text-decoration: none; }
        .contact-wa { background: #1f9d55; color: #fff; }
        .contact-tel { border: 1px solid #1f9d55; color: #1f6b3d; background: #fff; }
        .status-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-buttons button {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #cfe3d3;
            background: #f7fbf7;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            color: #0a3d38;
        }

        .status-buttons button:hover {
            background: #eaf7ee;
        }

        .status-buttons button.active-status {
            background: #0a3d38;
            color: #fff;
            border-color: #0a3d38;
        }

        .empty-msg {
            text-align: center;
            color: #777;
            padding: 40px 0;
        }

        .bulk-bar {
            display: none;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: #fff;
            border: 1px solid #cfe3d3;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.9em;
        }

        .bulk-bar .btn-sm {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #0a3d38;
            background: #fff;
            color: #0a3d38;
            font-weight: 600;
            cursor: pointer;
        }

        .bulk-bar .btn-danger {
            background: #b3261e;
            border-color: #b3261e;
            color: #fff;
        }

        .bulk-bar .btn-danger:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .select-row {
            margin-top: 10px;
            font-size: 0.85em;
            color: #555;
        }

        .select-row label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .config-warning {
            background: #fff8e1;
            border: 1px solid #f0d878;
            color: #7a5c00;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
    </style>
    <link rel="stylesheet" href="mobile-responsive.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="wrap">
        <div class="login-box" id="loginBox">
            <h1 style="font-size:1.3em;">Admin Pesanan</h1>
            <p>Masukkan kata sandi admin untuk melihat dan mengelola pesanan.</p>
            <input type="password" id="passwordInput" placeholder="Kata sandi admin">
            <div class="login-error" id="loginError">Kata sandi salah.</div>
            <button id="loginBtn">Masuk</button>
        </div>

        <div id="adminPanel">
            <div class="toolbar">
                <h1>Daftar Pesanan</h1>
                <div style="display:flex;gap:8px;align-items:center;">
                    <a href="admin-analitik.html" style="font-size:0.85em;color:#0a3d38;text-decoration:underline;">Lihat Analitik &rarr;</a>
                    <button class="refresh-btn" id="refreshBtn">Muat Ulang</button>
                    <button class="refresh-btn" id="exportCsvBtn" type="button">Unduh CSV</button>
                </div>
            </div>
            <input type="text" id="searchInput" placeholder="Cari nama, nomor HP, atau nomor pesanan..."
                style="width:100%;padding:12px 14px;border:1px solid #cfe3d3;border-radius:10px;margin-bottom:18px;box-sizing:border-box;">
            <div id="configWarning" class="config-warning" style="display:none;">
                Penyimpanan pesanan bersama belum terhubung. Pastikan Environment Variables Vercel untuk ORDERS_MASTER_KEY dan ORDERS_BIN_ID sudah diatur.
            </div>
            <div class="bulk-bar" id="bulkBar">
                <span id="bulkInfo"></span>
                <button type="button" class="btn-sm" id="selectAllDone">Pilih semua yang Selesai</button>
                <button type="button" class="btn-sm" id="clearSelection">Batal pilih</button>
                <button type="button" class="btn-sm btn-danger" id="deleteSelected" disabled>Hapus terpilih</button>
            </div>
            <div id="ordersList"></div>
        </div>
    </div>

    <script src="orders-config.js"></script>
    <script src="orders-store.js"></script>
    <script>
        let refreshTimer = null;

        function enterAdmin() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadOrders();
            if (!refreshTimer) refreshTimer = setInterval(loadOrders, 30000); // auto-refresh tiap 30 detik (satu timer saja)
        }

        // Login: bila server memakai ORDERS_ADMIN_KEY, kata sandi diperiksa oleh server.
        // Jika belum diaktifkan, perilaku lama dipertahankan (dibandingkan dengan ADMIN_PASSWORD).
        document.getElementById('loginBtn').addEventListener('click', async function () {
            const btn = this;
            const errEl = document.getElementById('loginError');
            const val = document.getElementById('passwordInput').value;
            errEl.style.display = 'none';
            btn.disabled = true;
            try {
                const check = await OrdersStore.verifyAdmin(val);
                if (check.ok && check.protectedByServer) return enterAdmin();
                if (!check.ok && /Tidak diizinkan/i.test(check.error || '')) {
                    OrdersStore.setAdminKey('');
                    errEl.textContent = 'Kata sandi salah.';
                    errEl.style.display = 'block';
                    return;
                }
                // Server menolak membuka daftar karena ORDERS_ADMIN_KEY belum diisi di Vercel.
                if (!check.ok && /ORDERS_ADMIN_KEY/i.test(check.error || '')) {
                    errEl.textContent = 'Daftar pesanan terkunci: isi variabel ORDERS_ADMIN_KEY di Vercel (Settings > Environment Variables) dengan kata sandi admin, lalu Redeploy.';
                    errEl.style.display = 'block';
                    return;
                }
                // Server belum memakai kata sandi admin: pakai pemeriksaan lama
                if (val === ADMIN_PASSWORD) return enterAdmin();
                OrdersStore.setAdminKey('');
                errEl.textContent = 'Kata sandi salah.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('passwordInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        document.getElementById('refreshBtn').addEventListener('click', loadOrders);

        let allOrders = [];
        const selected = new Set(); // nomor pesanan yang dicentang (hanya status Selesai)

        function doneOrders() {
            return allOrders.filter(o => o && o.orderId && o.status === 'Selesai');
        }

        function updateBulkBar() {
            const done = doneOrders();
            const bar = document.getElementById('bulkBar');
            // buang pilihan yang sudah tidak ada / bukan Selesai lagi
            const valid = new Set(done.map(o => o.orderId));
            Array.from(selected).forEach(id => { if (!valid.has(id)) selected.delete(id); });
            bar.style.display = done.length ? 'flex' : 'none';
            const total = allOrders
                .filter(o => selected.has(o.orderId))
                .reduce((sum, o) => sum + (Number(o.totalHarga) || 0), 0);
            document.getElementById('bulkInfo').textContent = selected.size
                ? selected.size + ' pesanan dipilih (Rp ' + total.toLocaleString('id-ID') + ')'
                : done.length + ' pesanan Selesai bisa dihapus';
            document.getElementById('deleteSelected').disabled = selected.size === 0;
        }

        document.getElementById('selectAllDone').addEventListener('click', function () {
            doneOrders().forEach(o => selected.add(o.orderId));
            renderList(document.getElementById('searchInput').value.trim().toLowerCase());
        });
        document.getElementById('clearSelection').addEventListener('click', function () {
            selected.clear();
            renderList(document.getElementById('searchInput').value.trim().toLowerCase());
        });
        document.getElementById('deleteSelected').addEventListener('click', async function () {
            if (!selected.size) return;
            const ids = Array.from(selected);
            const total = allOrders.filter(o => selected.has(o.orderId)).reduce((s, o) => s + (Number(o.totalHarga) || 0), 0);
            if (!confirm('Hapus ' + ids.length + ' pesanan Selesai (total Rp ' + total.toLocaleString('id-ID') +
                ')?\n\nData ini juga hilang dari Analitik (jumlah pesanan & pendapatan ikut berkurang). Tidak bisa dibatalkan.\n\nSaran: unduh Excel di halaman Analitik dulu bila datanya masih dibutuhkan.')) return;
            const btn = this;
            btn.disabled = true;
            const r = await OrdersStore.removeMany(ids);
            if (!r.success) {
                alert('Gagal menghapus: ' + r.error);
            } else {
                r.removed.forEach(id => selected.delete(id));
                if (r.skipped && r.skipped.length) alert(r.skipped.length + ' pesanan dilewati karena statusnya belum Selesai.');
            }
            await loadOrders();
        });

        // Semua data pesanan berasal dari input pelanggan, jadi wajib di-escape sebelum masuk innerHTML.
        function esc(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function safeImgSrc(src) {
            return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(String(src || '')) ? src : '';
        }

        document.getElementById('searchInput').addEventListener('input', function () {
            renderList(this.value.trim().toLowerCase());
        });

        function renderList(keyword) {
            const listEl = document.getElementById('ordersList');
            let shown = allOrders;

            if (keyword) {
                const normalizedKeyword = OrdersStore.normalizePhone(keyword);
                shown = allOrders.filter(o =>
                    ((o && o.orderId) || '').toLowerCase().includes(keyword) ||
                    ((o && o.nama) || '').toLowerCase().includes(keyword) ||
                    (normalizedKeyword && OrdersStore.normalizePhone((o && o.telepon) || '').includes(normalizedKeyword))
                );
            }

            if (!shown.length) {
                updateBulkBar();
                listEl.innerHTML = '<p class="empty-msg">' +
                    (keyword ? 'Tidak ada pesanan yang cocok dengan pencarian.' : 'Belum ada pesanan masuk.') +
                    '</p>';
                return;
            }

            try {
                listEl.innerHTML = shown.map(order => renderOrderCard(order)).join('');
            } catch (e) {
                listEl.innerHTML = '<p class="empty-msg" style="color:#b3261e;">Terjadi kesalahan saat menampilkan sebagian data: ' + e.message + '<br>Buka Console browser (F12) untuk detail lengkap.</p>';
                console.error('Gagal render daftar pesanan:', e, allOrders);
                return;
            }

            document.querySelectorAll('[data-select-id]').forEach(cb => {
                cb.addEventListener('change', function () {
                    if (this.checked) selected.add(this.dataset.selectId);
                    else selected.delete(this.dataset.selectId);
                    updateBulkBar();
                });
            });
            updateBulkBar();

            document.querySelectorAll('[data-action="update-status"]').forEach(btn => {
                btn.addEventListener('click', async function () {
                    const orderId = this.dataset.orderId;
                    const newStatus = this.dataset.status;
                    this.disabled = true;
                    const order = allOrders.find(o => o && o.orderId === orderId);
                    const result = await OrdersStore.updateStatus(orderId, newStatus, order);
                    if (!result.success) {
                        alert('Status pesanan belum berubah: ' + (result.error || 'Terjadi kesalahan.'));
                    }
                    await loadOrders();
                });
            });
        }

        async function loadOrders() {
            const listEl = document.getElementById('ordersList');
            if (!allOrders.length) {
                listEl.innerHTML = '<p class="empty-msg">Memuat data pesanan...</p>';
            }

            const configWarning = document.getElementById('configWarning');

            try {
                const { data, online, error } = await OrdersStore.load();
                // Saring entri yang tidak valid/rusak (misal data lama tanpa orderId) agar tidak mengganggu tampilan
                const valid = (data || []).filter(o => o && typeof o === 'object');
                allOrders = [...valid].reverse();

                if (!OrdersStore.isConfigured()) {
                    configWarning.textContent = 'Penyimpanan pesanan bersama belum terhubung. Pastikan Environment Variables Vercel untuk ORDERS_MASTER_KEY dan ORDERS_BIN_ID sudah diatur.';
                    configWarning.style.display = 'block';
                } else if (!online) {
                    configWarning.textContent = 'Gagal terhubung ke server penyimpanan bersama' + (error ? (': ' + esc(error)) : '') + '. Daftar di bawah ini adalah data cadangan dari perangkat ini, bisa jadi tidak lengkap/terbaru.';
                    configWarning.style.display = 'block';
                } else {
                    configWarning.style.display = 'none';
                }

                renderList(document.getElementById('searchInput').value.trim().toLowerCase());
            } catch (e) {
                listEl.innerHTML = '<p class="empty-msg" style="color:#b3261e;">Gagal memuat data: ' + e.message + '<br>Buka Console browser (F12) untuk detail lengkap.</p>';
                console.error('Gagal memuat pesanan:', e);
            }
        }

        function waNumber(phone) {
            let d = String(phone || '').replace(/\D/g, '');
            if (d.startsWith('0')) d = '62' + d.slice(1);
            else if (d.startsWith('8')) d = '62' + d;
            return d.length >= 10 ? d : '';
        }
        function contactRow(order, status) {
            const wa = waNumber(order.telepon);
            if (!wa) return '';
            const nama = String(order.nama || 'Pelanggan').trim();
            const id = order.orderId || '';
            const info = (order.produk || 'pesanan') + (order.jumlah ? ' x' + order.jumlah : '') + (order.totalHarga ? ', total Rp ' + Number(order.totalHarga).toLocaleString('id-ID') : '');
            const lacak = location.origin + '/lacak-pesanan.html?id=' + encodeURIComponent(id);
            const pesan = {
                'Dikonfirmasi': 'Halo Kak ' + nama + ', kami dari Margaluyu Farm. Pesanan Anda ' + id + ' (' + info + ') sudah kami terima dan akan segera kami proses.',
                'Dikemas': 'Halo Kak ' + nama + ', pesanan Anda ' + id + ' sedang kami kemas dan akan segera dikirim.',
                'Dikirim': 'Halo Kak ' + nama + ', pesanan Anda ' + id + ' sedang dalam pengiriman. Mohon ditunggu ya, Kak.',
                'Selesai': 'Halo Kak ' + nama + ', terima kasih sudah memesan di Margaluyu Farm. Pesanan ' + id + ' telah selesai. Kami senang bila Kakak berkenan memberi ulasan.'
            }[status] || ('Halo Kak ' + nama + ', kami dari Margaluyu Farm terkait pesanan ' + id + '.');
            const href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(pesan + '\n\nCek status pesanan: ' + lacak);
            return `<div class="contact-row"><a class="contact-wa" href="${esc(href)}" target="_blank" rel="noopener">Hubungi via WhatsApp</a><a class="contact-tel" href="tel:+${wa}">Telepon</a></div>`;
        }

        function renderOrderCard(order) {
            order = order || {};
            const orderId = order.orderId || '(tanpa nomor)';
            const status = OrdersStore.STATUS_STEPS.includes(order.status) ? order.status : OrdersStore.STATUS_STEPS[0];
            const steps = OrdersStore.STATUS_STEPS;
            const buttons = steps.map(s => {
                const isActive = s === status;
                return `<button data-action="update-status" data-order-id="${esc(orderId)}" data-status="${esc(s)}"
                    class="${isActive ? 'active-status' : ''}" ${isActive ? 'disabled' : ''}>${esc(s)}</button>`;
            }).join('');

            const bukti = safeImgSrc(order.buktiPembayaran);
            const buktiHtml = bukti
                ? `<div style="margin-top:8px;">
                        <a href="${bukti}" target="_blank" rel="noopener">
                            <img src="${bukti}" alt="Bukti pembayaran"
                                style="max-width:120px;border-radius:8px;border:1px solid #cfe3d3;display:block;">
                        </a>
                        <span style="font-size:0.8em;color:#888;">Klik gambar untuk memperbesar</span>
                   </div>`
                : '';

            const newBadge = status === 'Dikonfirmasi'
                ? '<span style="background:#e74c3c;color:#fff;font-size:0.72em;padding:2px 8px;border-radius:10px;margin-left:8px;">PESANAN BARU</span>'
                : '';

            return `
                <div class="order-card">
                    <div class="top-row">
                        <span class="order-id">${esc(orderId)}${newBadge}</span>
                        <span class="status-tag status-${esc(status)}">${esc(status)}</span>
                    </div>
                    <div class="order-detail">
                        <strong>${esc(order.nama || '-')}</strong> — ${esc(order.telepon || '-')}<br>
                        ${esc(order.alamat || '-')}<br>
                        Produk: ${esc(order.produk || '-')} x${esc(order.jumlah || '-')} · ${esc(order.langganan || '-')}<br>
                        Pembayaran: ${esc(order.metodePembayaran || '-')}${order.totalHarga ? ' · Total: Rp ' + Number(order.totalHarga).toLocaleString('id-ID') : ''} · Tanggal: ${esc(order.tanggal || '-')}
                        ${order.pesan ? '<br>Catatan: ' + esc(order.pesan) : ''}
                        ${buktiHtml}
                    </div>
                    <div class="status-buttons">${buttons}</div>
                    ${contactRow(order, status)}
                    ${status === 'Selesai' && order.orderId ? `<div class="select-row"><label><input type="checkbox" data-select-id="${esc(order.orderId)}" ${selected.has(order.orderId) ? 'checked' : ''}> Pilih untuk dihapus</label></div>` : ''}
                </div>
            `;
        }
    </script>
    <script>
        // Cadangan data: unduh semua pesanan sebagai CSV (dibuka di Excel/Google Sheets). Foto bukti tidak disertakan.
        (function () {
            var btn = document.getElementById('exportCsvBtn');
            if (!btn) return;
            function cell(v) {
                var t = v == null ? '' : String(v);
                if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; // cegah injeksi rumus di spreadsheet
                return '"' + t.replace(/"/g, '""') + '"';
            }
            btn.addEventListener('click', function () {
                var list = (typeof allOrders !== 'undefined' && allOrders.length) ? allOrders.slice().reverse() : [];
                if (!list.length) { alert('Belum ada pesanan untuk diunduh.'); return; }
                var keys = [];
                list.forEach(function (o) { Object.keys(o).forEach(function (k) { if (k !== 'buktiPembayaran' && keys.indexOf(k) === -1) keys.push(k); }); });
                var rows = [keys.map(cell).join(',')].concat(list.map(function (o) { return keys.map(function (k) { return cell(o[k]); }).join(','); }));
                var blob = new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'pesanan-margaluyu-' + new Date().toISOString().slice(0, 10) + '.csv';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
            });
        })();
    </script>
</body>

</html>
